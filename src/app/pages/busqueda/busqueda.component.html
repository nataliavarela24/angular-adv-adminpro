<div class="row animated fadeIn fast">
    <div class="col-4">
        <div class="card">
            <div class="card-body">
                <h3>Usuarios</h3>
                <div class="alert alert-info" *ngIf="usuarios.length === 0">
                    <p class="mb-0">No hay usuarios con ese término </p>
                </div>

                <div class="table-responsive" *ngIf="usuarios.length > 0">
                    <table class="table">
                        <thead *ngIf="usuarios.length > 0">
                            <tr>
                                <th>Avatar</th>
                                <th>Nombre</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let usuario of usuarios" class="animated fadeIn fast">
                                <td>
                                    <img [src]="usuario.img|| 'no-image' | imagen:'usuarios'" class="w50" />
                                </td>
                                <td>{{usuario.nombre}}</td>

                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-body">
                <h3>Médicos</h3>
                <div class="alert alert-info" *ngIf="medicos.length === 0">
                    <p class="mb-0">No hay médicos con ese término </p>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead *ngIf="medicos.length > 0">
                            <tr>
                                <th>Avatar</th>
                                <th>Nombre</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let medico of medicos" class="animated fadeIn fast cursor">
                                <td>
                                    <img [src]="medico.img|| 'no-image' | imagen:'medicos'" class="w50" />
                                </td>
                                <td>
                                    <a class="cursor" [routerLink]="['/dashboard/medicos', medico.id]">
                                        {{ medico.nombre }}
                                    </a>
                                </td>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-body">
                <h3>Hospitales</h3>
                <div class="alert alert-info" *ngIf="hospitales.length === 0">
                    <p class="mb-0">No hay hospitales con ese término </p>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead *ngIf="hospitales.length > 0">
                            <tr>
                                <th>Avatar</th>
                                <th>Nombre</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let hospital of hospitales" class="animated fadeIn fast">
                                <td>
                                    <img [src]="hospital.img|| 'no-image' | imagen:'hospitales'" class="w50" />
                                </td>
                                <td>{{hospital.nombre}}</td>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
